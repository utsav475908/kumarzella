# Local development stack: docker compose up --build   ->   http://localhost:8080
name: edgeledger

x-api-env: &api-env
  EL_ENVIRONMENT: development
  EL_DATABASE_URL: postgresql+psycopg://edgeledger:edgeledger@db:5432/edgeledger
  EL_REDIS_URL: redis://redis:6379/0
  EL_JOBS_EAGER: "false"
  EL_STORAGE_BACKEND: s3
  EL_S3_ENDPOINT_URL: http://minio:9000
  EL_S3_BUCKET: edgeledger
  EL_S3_ACCESS_KEY: edgeledger
  EL_S3_SECRET_KEY: edgeledger-dev-secret
  EL_SECRET_KEY: ${EL_SECRET_KEY:-dev-insecure-change-me}
  EL_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgeledger
      POSTGRES_PASSWORD: edgeledger
      POSTGRES_DB: edgeledger
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeledger"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: edgeledger
      MINIO_ROOT_PASSWORD: edgeledger-dev-secret
    volumes: [miniodata:/data]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "until mc alias set local http://minio:9000 edgeledger edgeledger-dev-secret; do sleep 1; done;
      mc mb --ignore-existing local/edgeledger; mc encrypt set sse-s3 local/edgeledger || true"

  migrate:
    build: ./backend
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment: *api-env
    ports: ["8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    environment: *api-env
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
