# Local development stack: docker compose up --build   ->   http://localhost:8080
name: edgeledger

x-api-env: &api-env
  EL_ENVIRONMENT: development
  EL_DATABASE_URL: postgresql+psycopg://edgeledger:edgeledger@db:5432/edgeledger
  EL_REDIS_URL: redis://redis:6379/0
  EL_JOBS_EAGER: "false"
  # Uploads (CSV files, screenshots) go to a shared Docker volume. Set EL_STORAGE_BACKEND=s3 and the EL_S3_* variables
  # to use S3 or any S3-compatible store instead.
  EL_STORAGE_BACKEND: local
  EL_STORAGE_LOCAL_PATH: /app/var/storage
  EL_SECRET_KEY: ${EL_SECRET_KEY:-dev-insecure-change-me}
  EL_CORS_ORIGINS: '["http://localhost:8080","http://localhost:5173"]'

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgeledger
      POSTGRES_PASSWORD: edgeledger
      POSTGRES_DB: edgeledger
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeledger"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  migrate:
    build: ./backend
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    environment: *api-env
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    volumes: [storage:/app/var/storage]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    environment: *api-env
    command: ["celery", "-A", "app.worker", "worker", "--loglevel=INFO", "--concurrency=2"]
    volumes: [storage:/app/var/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build: ./frontend
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  storage:
