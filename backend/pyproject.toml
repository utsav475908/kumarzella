[project]
name = "edgeledger-backend"
version = "0.3.0"
description = "EdgeLedger trading journal and analytics API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "argon2-cffi>=23.1",
  "redis>=5.0",
  "celery>=5.4",
  "boto3>=1.35",
  "python-multipart>=0.0.9",
  "structlog>=24.4",
  "tzdata>=2024.1",
  "anthropic>=1.13",
  "openai>=3.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["E501", "UP046", "SIM102", "B008", "S101", "S105", "S106", "B904", "UP042"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]
"alembic/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
