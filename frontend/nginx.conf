server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 12m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;

  # Docker's DNS, with the upstream in a variable: nginx looks the api up again instead of caching its address at
  # start-up, so recreating the api container doesn't leave this container proxying to a dead address (HTTP 502).
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /healthz { proxy_pass $api_upstream; }
  location / { try_files $uri /index.html; }
}
